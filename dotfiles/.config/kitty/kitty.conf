# Kitty terminal profile managed by mfansible.
# Override machine-specific settings in local.conf.

include themes/tokyo-night.conf
globinclude local.conf

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

disable_ligatures never
adjust_line_height 0
adjust_column_width 0

scrollback_lines 20000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

cursor_shape beam
cursor_blink_interval 0
cursor_stop_blinking_after 0
hide_mouse_when_typing yes

window_padding_width 8
confirm_os_window_close 0
remember_window_size yes
initial_window_width 120c
initial_window_height 36c

copy_on_select clipboard
strip_trailing_spaces smart
open_url_with default

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

enabled_layouts splits,stack,tall

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+f3 command_palette
map ctrl+shift+h show_scrollback
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
