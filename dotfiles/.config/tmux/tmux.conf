# ── Terminal & colour ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ── General behaviour ──────────────────────────────────────────────────────────
set -s escape-time 10          # lower delay so Neovim <Esc> feels snappy
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1      # panes start at 1 too
set -g renumber-windows on     # renumber windows after closing one
set -g mouse on                # mouse: click to focus, drag to resize
set -g focus-events on
set -g detach-on-destroy off
set -g history-limit 50000
set -g display-time 3000

# ── Prefix ─────────────────────────────────────────────────────────────────────
# Default prefix is C-b. Uncomment below to switch to C-a (screen-style).
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# ── Reload config ──────────────────────────────────────────────────────────────
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "Reloaded tmux config"

# ── Pane navigation (vim-style) ────────────────────────────────────────────────
# Works together with christoomey/vim-tmux-navigator in Neovim:
# <C-h/j/k/l> moves across both Neovim splits AND tmux panes transparently.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Pane splitting ─────────────────────────────────────────────────────────────
# | opens a vertical split (side-by-side), - opens a horizontal split (above/below)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# ── Project/session workflow ───────────────────────────────────────────────────
bind f display-popup -E -w 85% -h 85% "tmux-sessionizer"
bind F new-window -c "#{pane_current_path}" "tmux-sessionizer"

# ── Copy mode (vi keys) ─────────────────────────────────────────────────────────
set -g set-clipboard on
set -g @copy_command "xclip -in -selection clipboard"
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -g @copy_command "wl-copy"'
setw -g mode-keys vi
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# ── Status bar ─────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#c0caf5,bg=#1a1b26"

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]│ "

# Right: date + time
set -g status-right-length 60
set -g status-right "#[fg=#9ece6a] %Y-%m-%d  %H:%M #[default]"

# Window list: active window highlighted
setw -g window-status-current-style "fg=#f7768e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# ── Session API quick reference (read-only) ─────────────────────────────────────
# A target is a tuple of <session_name>[:<widx>|<wname>[.<pane_idx>]]
#
# tmux new-session   -s <name> -n <window> -d
# tmux list-sessions
# tmux attach-session -t <target>
# tmux has-session    -t=<target>    # note -t= not -t for exact match
# tmux switch-client  -t <target>
#
# tmux new-window    -n <name> [-t session:idx]
# tmux list-windows  [-t session]
# tmux select-window -t session:[idx|name]
#
# tmux send-keys     -t <target> "text" [keys...]

# ── TPM persistence ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if-shell 'test -r ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
