# ── Terminal & colour ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # 24-bit true colour

# ── General behaviour ──────────────────────────────────────────────────────────
set -s escape-time 10          # lower delay so Neovim <Esc> feels snappy
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1      # panes start at 1 too
set -g renumber-windows on     # renumber windows after closing one
set -g mouse on                # mouse: click to focus, drag to resize

# ── Prefix ─────────────────────────────────────────────────────────────────────
# Default prefix is C-b. Uncomment below to switch to C-a (screen-style).
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# ── Reload config ──────────────────────────────────────────────────────────────
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "Reloaded tmux config"

# ── Pane navigation (vim-style) ────────────────────────────────────────────────
# Works together with christoomey/vim-tmux-navigator in Neovim:
# <C-h/j/k/l> moves across both Neovim splits AND tmux panes transparently.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Pane splitting ─────────────────────────────────────────────────────────────
# | opens a vertical split (side-by-side), - opens a horizontal split (above/below)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# ── Copy mode (vi keys) ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# ── Status bar ─────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"   # Catppuccin Mocha colours

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[default]│ "

# Right: date + time
set -g status-right-length 60
set -g status-right "#[fg=#a6e3a1] %Y-%m-%d  %H:%M #[default]"

# Window list: active window highlighted
setw -g window-status-current-style "fg=#f38ba8,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Session API quick reference (read-only) ─────────────────────────────────────
# A target is a tuple of <session_name>[:<widx>|<wname>[.<pane_idx>]]
#
# tmux new-session   -s <name> -n <window> -d
# tmux list-sessions
# tmux attach-session -t <target>
# tmux has-session    -t=<target>    # note -t= not -t for exact match
# tmux switch-client  -t <target>
#
# tmux new-window    -n <name> [-t session:idx]
# tmux list-windows  [-t session]
# tmux select-window -t session:[idx|name]
#
# tmux send-keys     -t <target> "text" [keys...]

# ── TPM (Tmux Plugin Manager) — optional ───────────────────────────────────────
# Uncomment to enable. First install TPM:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'    # save/restore sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 15 min
#
# run '~/.tmux/plugins/tpm/tpm'
