# 🎯 Playbook: Install Latest Stable Neovim from Source
- name: Install Latest Neovim from Source
  hosts: localhost
  gather_facts: true

  vars:
    neovim_src_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/personal/neovim"
    neovim_install_prefix: /usr/local

  tasks:
    - name: Get latest stable Neovim version
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
      register: neovim_release

    - name: Set Neovim version
      ansible.builtin.set_fact:
        neovim_version: "{{ neovim_release.json.tag_name }}"

    - name: Display version being installed
      ansible.builtin.debug:
        msg: "Installing Neovim {{ neovim_version }}"

    - name: Install Neovim build dependencies
      become: true
      ansible.builtin.apt:
        name:
          - ninja-build
          - gettext
          - cmake
          - unzip
          - curl
          - build-essential
          - git
        state: present
        update_cache: true

    - name: Clone Neovim source
      ansible.builtin.git:
        repo: "https://github.com/neovim/neovim.git"
        dest: "{{ neovim_src_dir }}"
        version: "{{ neovim_version }}"
        depth: 1
        single_branch: true
        force: true

    - name: Remove stale Neovim build directories
      ansible.builtin.file:
        path: "{{ neovim_src_dir }}/{{ item }}"
        state: absent
      loop:
        - build
        - .deps

    - name: Remove stale system-wide Neovim install
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ neovim_install_prefix }}/bin/nvim"
        - "{{ neovim_install_prefix }}/share/nvim"
        - "{{ neovim_install_prefix }}/lib/nvim"
        - "{{ neovim_install_prefix }}/include/nvim"

    - name: Build Neovim from source
      ansible.builtin.make:
        chdir: "{{ neovim_src_dir }}"
        params:
          CMAKE_BUILD_TYPE: RelWithDebInfo
          CMAKE_INSTALL_PREFIX: "{{ neovim_install_prefix }}"
      register: build_result

    - name: Install Neovim system-wide
      become: true
      ansible.builtin.make:
        target: install
        chdir: "{{ neovim_src_dir }}"
        params:
          CMAKE_INSTALL_PREFIX: "{{ neovim_install_prefix }}"

    - name: Verify installed Neovim
      ansible.builtin.command: "{{ neovim_install_prefix }}/bin/nvim --version"
      register: nvim_version_check
      changed_when: false

    - name: Display installed Neovim version
      ansible.builtin.debug:
        var: nvim_version_check.stdout_lines
