# Playbook: setup dotfiles in symlink mode.
#
# Mirrors dev-env/runs/dotfiles:
# - dotfiles/.config/<dir> -> $XDG_CONFIG_HOME/<dir>
# - dotfiles/.local/<dir>  -> ~/.local/<dir>
# - dotfiles/.* files      -> ~/.*

- name: Setup dotfiles
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    sudo_user: "{{ lookup('env', 'SUDO_USER') | default('', true) }}"
    env_user: "{{ lookup('env', 'USER') | default(ansible_user_id, true) }}"
    real_user: "{{ sudo_user if sudo_user | length > 0 else env_user }}"
    real_home: >-
      {{
        lookup('pipe', 'getent passwd ' + sudo_user + ' | cut -d: -f6')
        if sudo_user | length > 0
        else lookup('env', 'HOME') | default(ansible_env.HOME, true)
      }}
    xdg_config_home: "{{ lookup('env', 'XDG_CONFIG_HOME') | default(real_home + '/.config', true) }}"
    dotfiles_dir: "{{ playbook_dir }}/dotfiles"
    force_relink: true

  tasks:
    - name: Display configuration paths
      ansible.builtin.debug:
        msg:
          - "Real user: {{ real_user }}"
          - "Real home: {{ real_home }}"
          - "XDG_CONFIG_HOME: {{ xdg_config_home }}"
          - "Dotfiles directory: {{ dotfiles_dir }}"
          - "Force relink: {{ force_relink }}"

    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ real_user }}"
      loop:
        - "{{ xdg_config_home }}"
        - "{{ real_home }}/.local"

    - name: Check source directories
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { key: config, path: "{{ dotfiles_dir }}/.config" }
        - { key: local, path: "{{ dotfiles_dir }}/.local" }
      register: source_dirs
      loop_control:
        label: "{{ item.path }}"

    - name: Find config directories to symlink
      ansible.builtin.find:
        paths: "{{ dotfiles_dir }}/.config"
        file_type: directory
        recurse: false
      register: config_dirs
      when: source_dirs.results[0].stat.isdir | default(false)

    - name: Find local directories to symlink
      ansible.builtin.find:
        paths: "{{ dotfiles_dir }}/.local"
        file_type: directory
        recurse: false
      register: local_dirs
      when: source_dirs.results[1].stat.isdir | default(false)

    - name: Find root dotfiles to symlink
      ansible.builtin.find:
        paths: "{{ dotfiles_dir }}"
        patterns: ".*"
        hidden: true
        file_type: file
        recurse: false
      register: root_dotfiles

    - name: Remove config targets before relinking
      ansible.builtin.file:
        path: "{{ xdg_config_home }}/{{ item.path | basename }}"
        state: absent
      loop: "{{ config_dirs.files | default([]) }}"
      when: force_relink
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Symlink config directories
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ xdg_config_home }}/{{ item.path | basename }}"
        state: link
        force: true
        owner: "{{ real_user }}"
      loop: "{{ config_dirs.files | default([]) }}"
      when: not ansible_check_mode
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Remove local targets before relinking
      ansible.builtin.file:
        path: "{{ real_home }}/.local/{{ item.path | basename }}"
        state: absent
      loop: "{{ local_dirs.files | default([]) }}"
      when: force_relink
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Symlink local directories
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ real_home }}/.local/{{ item.path | basename }}"
        state: link
        force: true
        owner: "{{ real_user }}"
      loop: "{{ local_dirs.files | default([]) }}"
      when: not ansible_check_mode
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Remove root dotfile targets before relinking
      ansible.builtin.file:
        path: "{{ real_home }}/{{ item.path | basename }}"
        state: absent
      loop: "{{ root_dotfiles.files | default([]) }}"
      when: force_relink
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Symlink root dotfiles
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ real_home }}/{{ item.path | basename }}"
        state: link
        force: true
        owner: "{{ real_user }}"
      loop: "{{ root_dotfiles.files | default([]) }}"
      when: not ansible_check_mode
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Dotfiles symlink setup complete
      ansible.builtin.debug:
        msg: "Dotfiles symlinked from {{ dotfiles_dir }}"
