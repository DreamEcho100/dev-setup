# 🎯 Playbook: Setup Dotfiles (symlink mode)
# Symlinks your repo files into ~/.config and ~ so edits in the repo
# are reflected live in your system.

- name: Setup dotfiles (symlinks)
  hosts: localhost
  connection: local
  vars:
    real_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    real_home: "{{ lookup('env', 'HOME') if lookup('env', 'SUDO_USER') == '' else lookup('pipe', 'getent passwd ' + lookup('env', 'SUDO_USER') + ' | cut -d: -f6') }}"
    xdg_config_home: "{{ lookup('env', 'XDG_CONFIG_HOME') | default(real_home + '/.config', true) }}"
    dotfiles_dir: "{{ playbook_dir }}/dotfiles"
    # Set to true to wipe existing files/dirs at the target before linking
    force_relink: true

  tasks:
    - name: Display configuration paths
      ansible.builtin.debug:
        msg:
          - "Real user: {{ real_user }}"
          - "Real user home: {{ real_home }}"
          - "XDG_CONFIG_HOME: {{ xdg_config_home }}"
          - "Dotfiles directory: {{ dotfiles_dir }}"
          - "Force relink: {{ force_relink }}"

    - name: Ensure XDG_CONFIG_HOME exists
      ansible.builtin.file:
        path: "{{ xdg_config_home }}"
        state: directory
        mode: "0755"
        owner: "{{ real_user }}"

    # 🔍 Find config subdirectories (e.g. dotfiles/.config/nvim)
    - name: Check if dotfiles/.config exists
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/.config"
      register: config_dir_stat

    - name: Find config directories to symlink
      ansible.builtin.find:
        paths: "{{ dotfiles_dir }}/.config"
        file_type: directory
        recurse: false
      register: config_dirs
      when: config_dir_stat.stat.exists and config_dir_stat.stat.isdir

    # 🧹 Remove existing target if it's NOT already the correct symlink
    - name: Remove stale targets in ~/.config (only if not already a correct symlink)
      ansible.builtin.file:
        path: "{{ xdg_config_home }}/{{ item.path | basename }}"
        state: absent
      loop: "{{ config_dirs.files | default([]) }}"
      when:
        - force_relink
        - config_dirs is defined
      loop_control:
        label: "{{ item.path | basename }}"

    # 🔗 Create symlinks for each config directory
    - name: Symlink config directories into ~/.config
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ xdg_config_home }}/{{ item.path | basename }}"
        state: link
        force: true
        owner: "{{ real_user }}"
      loop: "{{ config_dirs.files | default([]) }}"
      when: config_dirs is defined
      loop_control:
        label: "{{ item.path | basename }}"

    # 📄 Find dotfiles in repo root (e.g. .bashrc, .zshrc)
    - name: Find individual dotfiles
      ansible.builtin.find:
        paths: "{{ dotfiles_dir }}"
        patterns: ".*"
        hidden: true
        file_type: file
        recurse: false
      register: dotfiles

    - name: Remove stale dotfile targets in home (force_relink)
      ansible.builtin.file:
        path: "{{ real_home }}/{{ item.path | basename }}"
        state: absent
      loop: "{{ dotfiles.files }}"
      when: force_relink and dotfiles.files | length > 0
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Symlink individual dotfiles into home
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ real_home }}/{{ item.path | basename }}"
        state: link
        force: true
        owner: "{{ real_user }}"
      loop: "{{ dotfiles.files }}"
      when: dotfiles.files | length > 0
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Dotfiles symlink setup complete
      ansible.builtin.debug:
        msg: "✓ Dotfiles symlinked from {{ dotfiles_dir }}"
